name: Hospital Appointment API CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  quality:
    name: Quality, Tests and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install

      - name: Gate 1 - Ruff lint
        run: poetry run ruff check .

      - name: Gate 2 - Pytest coverage
        run: |
          poetry run pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=85

      - name: Gate 3 - Bandit security scan
        run: poetry run bandit -r app

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: quality

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hospital-appointment-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hospital-appointment-api:${{ github.sha }}